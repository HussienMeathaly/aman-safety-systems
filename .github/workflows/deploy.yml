name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # هذا السطر يتيح لك التشغيل اليدوي بضغطة زر
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          npm install
          npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          # إعدادات لتقليل الضغط ومنع قطع الاتصال من قبل الاستضافة
          protocol: ftp
          port: 21
          concurrency: 1
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
